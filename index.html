<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品コンテンツ自動生成ツール｜Y-KAGU</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #c8778a; --rose-light: #f0d5db; --rose-dark: #9e4f62;
    --cream: #fdf8f5; --warm-gray: #6b5d5d; --dark: #2a1f1f;
    --gold: #c4a882; --border: #e8d5d5; --success: #7a9e7e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--cream); color: var(--dark); font-family: 'Noto Sans JP', sans-serif; font-weight: 300; min-height: 100vh; }

  header { background: var(--dark); padding: 20px 40px; display: flex; align-items: center; gap: 16px; border-bottom: 2px solid var(--rose); }
  .logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--rose-light); letter-spacing: 3px; }
  .subtitle { font-size: 11px; color: var(--gold); letter-spacing: 2px; margin-top: 2px; }

  .container { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }
  .page-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; color: var(--rose-dark); letter-spacing: 2px; margin-bottom: 6px; }
  .page-desc { font-size: 13px; color: var(--warm-gray); margin-bottom: 36px; }

  .card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 32px 36px; margin-bottom: 28px; box-shadow: 0 2px 16px rgba(200,119,138,0.06); }
  .card-title { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--rose-dark); margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--rose-light); letter-spacing: 1px; }
  .card-title span { font-size: 12px; font-family: 'Noto Sans JP', sans-serif; color: var(--warm-gray); font-weight: 300; margin-left: 10px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .form-row.single { grid-template-columns: 1fr; }
  .form-row.triple { grid-template-columns: 1fr 1fr 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 12px; color: var(--warm-gray); letter-spacing: 1px; font-weight: 500; }
  .req { color: var(--rose); margin-left: 3px; }
  input, textarea {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px;
    font-family: 'Noto Sans JP', sans-serif; font-size: 13px; font-weight: 300;
    color: var(--dark); background: var(--cream); transition: border-color 0.2s; outline: none; resize: vertical;
  }
  input:focus, textarea:focus { border-color: var(--rose); background: white; }
  textarea { min-height: 90px; }

  .image-upload-area { border: 2px dashed var(--border); border-radius: 10px; padding: 28px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--cream); position: relative; }
  .image-upload-area:hover { border-color: var(--rose); background: var(--rose-light); }
  .image-upload-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-icon { font-size: 32px; margin-bottom: 8px; }
  .upload-text { font-size: 13px; color: var(--warm-gray); }
  .upload-text strong { color: var(--rose-dark); }
  .image-previews { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .preview-item { position: relative; width: 80px; height: 80px; border-radius: 8px; overflow: hidden; border: 2px solid var(--rose-light); }
  .preview-item img { width: 100%; height: 100%; object-fit: cover; }
  .rm-btn { position: absolute; top: 2px; right: 2px; background: var(--rose); color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .generate-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--rose-dark), var(--rose)); color: white; border: none; border-radius: 10px; font-family: 'Cormorant Garamond', serif; font-size: 20px; letter-spacing: 3px; cursor: pointer; transition: all 0.3s; margin-top: 10px; }
  .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(200,119,138,0.4); }
  .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .loading-overlay { display: none; text-align: center; padding: 40px; color: var(--warm-gray); }
  .loading-overlay.active { display: block; }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--rose-light); border-top-color: var(--rose); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .results-section { display: none; margin-top: 36px; }
  .results-section.active { display: block; }

  .result-tabs { display: flex; flex-wrap: wrap; border-bottom: 2px solid var(--rose-light); }
  .tab-btn { padding: 11px 14px; border: none; background: transparent; font-family: 'Noto Sans JP', sans-serif; font-size: 12px; font-weight: 500; color: var(--warm-gray); cursor: pointer; letter-spacing: 0.5px; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; white-space: nowrap; }
  .tab-btn.active { color: var(--rose-dark); border-bottom-color: var(--rose-dark); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .result-card { background: white; border: 1px solid var(--border); border-top: none; border-radius: 0 0 12px 12px; padding: 28px 32px; box-shadow: 0 2px 16px rgba(200,119,138,0.06); }

  .result-block { border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; margin-bottom: 14px; position: relative; background: var(--cream); }
  .block-label { display: inline-block; background: var(--rose-light); color: var(--rose-dark); font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; letter-spacing: 1px; }
  .result-text { font-size: 13px; line-height: 1.9; color: var(--dark); white-space: pre-wrap; padding-right: 64px; }
  .copy-btn { position: absolute; top: 12px; right: 12px; background: white; border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; font-size: 11px; color: var(--warm-gray); cursor: pointer; transition: all 0.2s; font-family: 'Noto Sans JP', sans-serif; }
  .copy-btn:hover { background: var(--rose-light); color: var(--rose-dark); border-color: var(--rose); }
  .copy-btn.copied { background: var(--success); color: white; border-color: var(--success); }
  .copy-all-btn { margin-top: 18px; padding: 10px 24px; background: var(--dark); color: var(--rose-light); border: none; border-radius: 8px; font-size: 12px; cursor: pointer; letter-spacing: 1px; transition: all 0.2s; font-family: 'Noto Sans JP', sans-serif; }
  .copy-all-btn:hover { background: var(--rose-dark); }

  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .summary-item { background: var(--cream); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; position: relative; }
  .s-label { font-size: 11px; color: var(--rose-dark); font-weight: 500; margin-bottom: 6px; letter-spacing: 1px; }
  .s-text { font-size: 13px; line-height: 1.8; color: var(--dark); white-space: pre-wrap; padding-right: 52px; }

  .error-msg { background: #fff0f0; border: 1px solid #ffcccc; border-radius: 8px; padding: 14px 18px; color: #c0392b; font-size: 13px; margin-top: 16px; }
  .apikey-bar { background: var(--dark); padding: 12px 40px; display: flex; align-items: center; gap: 12px; }
  .apikey-bar label { color: var(--gold); font-size: 12px; white-space: nowrap; }
  .apikey-bar input { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid var(--rose); border-radius: 6px; padding: 7px 12px; color: white; font-size: 12px; font-family: monospace; outline: none; }
  .apikey-bar button { background: var(--rose); color: white; border: none; border-radius: 6px; padding: 7px 16px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .apikey-saved { color: var(--success); font-size: 11px; }

  @media (max-width: 680px) {
    .form-row, .form-row.triple { grid-template-columns: 1fr; }
    .card { padding: 24px 20px; } header { padding: 16px 20px; }
    .container { padding: 24px 16px 60px; } .summary-grid { grid-template-columns: 1fr; }
    .tab-btn { font-size: 11px; padding: 9px 10px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Y-KAGU</div>
    <div class="subtitle">PRODUCT CONTENT GENERATOR</div>
  </div>
  <span style="color:var(--rose);margin:0 10px">|</span>
  <div style="font-size:13px;color:var(--gold);">商品コンテンツ自動生成ツール</div>
</header>

<div class="apikey-bar">
  <label>🔑 APIキー：</label>
  <input type="password" id="apikeyInput" placeholder="sk-ant-api03-..." />
  <button onclick="saveApiKey()">保存</button>
  <span class="apikey-saved" id="apikeySaved" style="display:none">✓ 保存済み</span>
</div>

<div class="container">
  <h1 class="page-title">商品コンテンツ自動生成</h1>
  <p class="page-desc">商品情報を入力するだけで、販売に必要なすべてのコンテンツをAIが自動生成します。</p>

  <div class="card">
    <div class="card-title">商品情報入力 <span>※は必須</span></div>

    <div class="form-row single" style="margin-bottom:20px;">
      <div class="form-group">
        <label>商品画像 <span class="req">※</span>（複数可・最大4枚）</label>
        <div class="image-upload-area">
          <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImages(event)">
          <div class="upload-icon">🖼️</div>
          <div class="upload-text">クリックして画像を選択<br><strong>複数枚アップロード可能（最大4枚）</strong></div>
        </div>
        <div class="image-previews" id="imagePreviews"></div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>ブランド・シリーズ名 <span class="req">※</span></label>
        <input type="text" id="brandName" placeholder="例：Y-KAGUオリジナル　ローズエリゼ">
      </div>
      <div class="form-group">
        <label>商品カテゴリ <span class="req">※</span></label>
        <input type="text" id="category" placeholder="例：3Wayカウチソファ">
      </div>
    </div>

    <div class="form-row single">
      <div class="form-group">
        <label>商品の特徴・利点 <span class="req">※</span>（メーカー資料そのままでOK）</label>
        <textarea id="features" placeholder="例：&#10;・背もたれが外せるので搬入しやすい&#10;・座面・クッションカバーが洗える&#10;・ピンクのエレガントなフリルがポイント&#10;・オットマンが分解でき3パターンの使い方ができる"></textarea>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>ターゲット（ペルソナ）</label>
        <textarea id="target">美意識が高く、生活空間にこだわりを持ち、上質なものを手に入れることでライフスタイルを向上させたい30～50代の中高所得者層。家具を機能だけでなく、ステータスシンボルや個性の表現手段と捉えている人々。</textarea>
      </div>
      <div class="form-group">
        <label>スタイル・デザインキーワード</label>
        <textarea id="style">ロココ調、姫系、輸入家具、エレガント、フレンチスタイル、おしゃれ</textarea>
      </div>
    </div>

    <div class="form-row triple">
      <div class="form-group">
        <label>価格帯（任意）</label>
        <input type="text" id="price" placeholder="例：198,000円">
      </div>
      <div class="form-group">
        <label>素材・カラー（任意）</label>
        <input type="text" id="material" placeholder="例：ベルベット生地、ピンク">
      </div>
      <div class="form-group">
        <label>サイズ（任意）</label>
        <input type="text" id="size" placeholder="例：W2200×D1600×H880mm">
      </div>
    </div>

    <button class="generate-btn" id="generateBtn" onclick="generate()">
      ✨ AIでコンテンツをすべて自動生成する
    </button>
    <div id="errorMsg" class="error-msg" style="display:none;"></div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div style="font-size:14px;">AIがすべてのコンテンツを生成中...</div>
    <div style="font-size:12px;color:var(--warm-gray);margin-top:8px;">商品名 / キーワード / SEO / 商品説明 / Googleショッピング / オススメ場所 / 関連ワード / LP構成 を作成しています</div>
  </div>

  <div class="results-section" id="resultsSection">
    <div class="result-tabs">
      <button class="tab-btn active" onclick="switchTab(0)">📋 一覧</button>
      <button class="tab-btn" onclick="switchTab(1)">① 商品名・キーワード</button>
      <button class="tab-btn" onclick="switchTab(2)">② SEOタイトル・説明文</button>
      <button class="tab-btn" onclick="switchTab(3)">③ サイト商品説明</button>
      <button class="tab-btn" onclick="switchTab(4)">④ 楽天ネーミング</button>
      <button class="tab-btn" onclick="switchTab(5)">⑤ LP構成</button>
    </div>

    <!-- 0: 一覧 -->
    <div class="tab-content active result-card" id="tab-0">
      <p style="font-size:12px;color:var(--warm-gray);margin-bottom:18px;">推奨パターン（パターン1）の一覧です。各タブで全パターンを確認・コピーできます。</p>
      <div class="summary-grid" id="summary-grid"></div>
    </div>

    <!-- 1: 商品名・キーワード -->
    <div class="tab-content result-card" id="tab-1">
      <div id="content-1"></div>
      <button class="copy-all-btn" onclick="copyAllTab(1)">このタブの内容をすべてコピー</button>
    </div>

    <!-- 2: SEO -->
    <div class="tab-content result-card" id="tab-2">
      <div id="content-2"></div>
      <button class="copy-all-btn" onclick="copyAllTab(2)">このタブの内容をすべてコピー</button>
    </div>

    <!-- 3: サイト説明 -->
    <div class="tab-content result-card" id="tab-3">
      <div id="content-3"></div>
      <button class="copy-all-btn" onclick="copyAllTab(3)">このタブの内容をすべてコピー</button>
    </div>

    <!-- 4: 楽天 -->
    <div class="tab-content result-card" id="tab-4">
      <div id="content-4"></div>
      <button class="copy-all-btn" onclick="copyAllTab(4)">このタブの内容をすべてコピー</button>
    </div>

    <!-- 5: LP -->
    <div class="tab-content result-card" id="tab-5">
      <div id="content-5"></div>
      <button class="copy-all-btn" onclick="copyAllTab(5)">このタブの内容をすべてコピー</button>
    </div>
  </div>
</div>

<script>
let uploadedImages = [];

function saveApiKey() {
  const key = document.getElementById('apikeyInput').value.trim();
  if (!key) return;
  sessionStorage.setItem('ykagu_apikey', key);
  document.getElementById('apikeySaved').style.display = 'inline';
  document.getElementById('apikeyInput').value = '●'.repeat(20);
}

function getApiKey() {
  return sessionStorage.getItem('ykagu_apikey') || '';
}

// ページ読み込み時にキーが保存済みなら表示
window.addEventListener('load', () => {
  if (getApiKey()) {
    document.getElementById('apikeyInput').value = '●'.repeat(20);
    document.getElementById('apikeySaved').style.display = 'inline';
  }
});

function handleImages(e) {
  Array.from(e.target.files).forEach(file => {
    if (uploadedImages.length >= 4) return;
    const reader = new FileReader();
    reader.onload = ev => {
      uploadedImages.push({ base64: ev.target.result.split(',')[1], dataUrl: ev.target.result, type: file.type });
      renderPreviews();
    };
    reader.readAsDataURL(file);
  });
}
function renderPreviews() {
  document.getElementById('imagePreviews').innerHTML = uploadedImages.map((img, i) =>
    `<div class="preview-item"><img src="${img.dataUrl}"><button class="rm-btn" onclick="removeImage(${i})">✕</button></div>`
  ).join('');
}
function removeImage(i) { uploadedImages.splice(i, 1); renderPreviews(); }

function switchTab(idx) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.querySelectorAll('.tab-content').forEach((c, i) => c.classList.toggle('active', i === idx));
}

async function generate() {
  const brandName = document.getElementById('brandName').value.trim();
  const category  = document.getElementById('category').value.trim();
  const features  = document.getElementById('features').value.trim();
  if (!getApiKey()) { showError('APIキーを入力して「保存」を押してください。'); return; }
  if (!brandName || !category || !features) { showError('ブランド名・カテゴリ・商品の特徴は必須です。'); return; }
  if (uploadedImages.length === 0) { showError('商品画像を1枚以上アップロードしてください。'); return; }
  hideError();
  setLoading(true);

  const productName = `${brandName}　${category}`;
  const target   = document.getElementById('target').value;
  const style    = document.getElementById('style').value;
  const price    = document.getElementById('price').value;
  const material = document.getElementById('material').value;
  const size     = document.getElementById('size').value;

  const prompt = `あなたは一流の広告ライターです。
以下の商品について、すべての項目をJSON形式で出力してください。余計なテキスト・Markdownは一切不要、JSONのみ出力。

【商品名】${productName}
【商品の特徴・利点】
${features}
【ターゲット】${target}
【スタイル・キーワード】${style}
${price ? `【価格帯】${price}` : ''}${material ? `\n【素材・カラー】${material}` : ''}${size ? `\n【サイズ】${size}` : ''}

【共通条件】
・日本語・SEOに強い・柔らかい文体・難しい漢字を減らす
・「輸入家具」「ロココ調」「おしゃれ」「姫系」を適切に使う

出力JSON：
{
  "site_product_names": [
    "サイト販売用の商品名パターン1（SEO考慮・魅力的・60文字以内）",
    "パターン2",
    "パターン3"
  ],
  "keywords": ["キーワード1","キーワード2","キーワード3","キーワード4","キーワード5","キーワード6","キーワード7","キーワード8","キーワード9","キーワード10"],
  "seo_titles": [
    "SEOタイトル パターン1（60文字以内・検索上位を狙う）",
    "パターン2",
    "パターン3"
  ],
  "seo_descriptions": [
    "SEOディスクリプション パターン1（120文字前後・検索結果で目を引く）",
    "パターン2",
    "パターン3"
  ],
  "site_descriptions": [
    "HP掲載用の商品説明文 パターン1（500文字程度・購買意欲を高める・この商品で生活がどう変わるかを含む）",
    "パターン2",
    "パターン3"
  ],
  "google_shopping_names": [
    "Googleショッピング用商品名 パターン1（素材・色・サイズ・特徴を含む・70文字以内）",
    "パターン2",
    "パターン3"
  ],
  "recommended_places": [
    "オススメの場所・シーン1（具体的に）",
    "オススメ2",
    "オススメ3",
    "オススメ4",
    "オススメ5"
  ],
  "related_words": ["関連ワード1","関連ワード2","関連ワード3","関連ワード4","関連ワード5","関連ワード6","関連ワード7","関連ワード8","関連ワード9","関連ワード10"],
  "rakuten_names": [
    "楽天検索上位向け商品名（特徴・検索ワードを★で区切る・300文字程度）パターン1",
    "パターン2",
    "パターン3"
  ],
  "lp": {
    "catchcopy": "キャッチコピー（短く印象的に）",
    "awareness": "喚起（300文字程度）：お客様が何を悩んでどんな理想を求めてこの商品を探したのか",
    "result": "結果（300文字程度）：この商品でどんな問題が解決し、どんな生活になるか",
    "proof": "証拠（300文字程度）：素材・構造・仕様など、なぜその結果を得られると言えるか",
    "resonance": "共鳴（200文字程度）：商品のこだわり、ユーザーの声の例",
    "closing": "最後の一言（200文字程度）：締めの言葉。今安いなどの表現は禁止"
  }
}`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': getApiKey(), 'anthropic-version': '2023-06-01' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 4000,
        messages: [{
          role: 'user',
          content: [
            ...uploadedImages.slice(0,4).map(img => ({ type: 'image', source: { type: 'base64', media_type: img.type, data: img.base64 } })),
            { type: 'text', text: prompt }
          ]
        }]
      })
    });
    if (!response.ok) { const e = await response.json(); throw new Error(e.error?.message || 'APIエラー'); }
    const data = await response.json();
    const raw = data.content.map(c => c.text || '').join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    const d = JSON.parse(clean);
    renderAll(d);
    setLoading(false);
    document.getElementById('resultsSection').classList.add('active');
    document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch(err) {
    setLoading(false);
    showError('エラーが発生しました: ' + err.message);
  }
}

function renderAll(d) {
  // タブ1: 商品名・キーワード・Googleショッピング・オススメ・関連ワード
  document.getElementById('content-1').innerHTML =
    renderPatterns('サイト販売用 商品名', d.site_product_names) +
    renderPatterns('Googleショッピング用 商品名', d.google_shopping_names) +
    renderList('キーワード（10個）', d.keywords) +
    renderList('オススメ場所・シーン', d.recommended_places) +
    renderList('関連ワード（10個）', d.related_words);

  // タブ2: SEO
  document.getElementById('content-2').innerHTML =
    renderPatterns('SEOタイトル', d.seo_titles) +
    renderPatterns('SEOディスクリプション', d.seo_descriptions);

  // タブ3: サイト商品説明
  document.getElementById('content-3').innerHTML = renderPatterns('HP掲載用 商品説明文', d.site_descriptions);

  // タブ4: 楽天
  document.getElementById('content-4').innerHTML = renderPatterns('楽天ネーミング', d.rakuten_names);

  // タブ5: LP
  document.getElementById('content-5').innerHTML = renderLP(d.lp);

  // タブ0: 一覧
  document.getElementById('summary-grid').innerHTML = [
    { label: 'サイト販売用 商品名（推奨）',          text: d.site_product_names?.[0] },
    { label: 'Googleショッピング用 商品名（推奨）',   text: d.google_shopping_names?.[0] },
    { label: 'SEOタイトル（推奨）',                  text: d.seo_titles?.[0] },
    { label: 'SEOディスクリプション（推奨）',         text: d.seo_descriptions?.[0] },
    { label: 'キーワード',                           text: (d.keywords||[]).join('　/　') },
    { label: 'オススメ場所・シーン',                  text: (d.recommended_places||[]).join('\n') },
    { label: '関連ワード',                           text: (d.related_words||[]).join('　/　') },
    { label: 'HP商品説明文（推奨）',                  text: d.site_descriptions?.[0] },
  ].map(item => `
    <div class="summary-item">
      <div class="s-label">${item.label}</div>
      <button class="copy-btn" onclick="copyBlock(this)">コピー</button>
      <div class="s-text">${esc(item.text||'')}</div>
    </div>
  `).join('');
}

function renderPatterns(label, arr) {
  return (arr||[]).map((text, i) => `
    <div class="result-block">
      <span class="block-label">${label} — パターン${i+1}</span>
      <button class="copy-btn" onclick="copyBlock(this)">コピー</button>
      <div class="result-text">${esc(text)}</div>
    </div>
  `).join('');
}

function renderList(label, arr) {
  const text = (arr||[]).map((w, i) => `${i+1}. ${w}`).join('\n');
  return `
    <div class="result-block">
      <span class="block-label">${label}</span>
      <button class="copy-btn" onclick="copyBlock(this)">コピー</button>
      <div class="result-text">${esc(text)}</div>
    </div>
  `;
}

function renderLP(lp) {
  return [
    { key:'catchcopy', label:'🎯 キャッチコピー' },
    { key:'awareness', label:'💭 喚起（お客様の悩み）' },
    { key:'result',    label:'✨ 結果（この商品で変わること）' },
    { key:'proof',     label:'🔍 証拠（なぜ叶えられるか）' },
    { key:'resonance', label:'💫 共鳴（こだわり・ユーザーの声）' },
    { key:'closing',   label:'🌹 最後の一言' },
  ].map(s => `
    <div class="result-block">
      <span class="block-label">${s.label}</span>
      <button class="copy-btn" onclick="copyBlock(this)">コピー</button>
      <div class="result-text">${esc((lp||{})[s.key]||'')}</div>
    </div>
  `).join('');
}

function copyBlock(btn) {
  navigator.clipboard.writeText(btn.nextElementSibling.textContent).then(() => {
    btn.textContent = '✓ 済';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('copied'); }, 2000);
  });
}
function copyAllTab(idx) {
  const texts = Array.from(document.querySelectorAll(`#tab-${idx} .result-text`))
    .map(el => el.textContent.trim()).join('\n\n---\n\n');
  navigator.clipboard.writeText(texts).then(() => alert('すべてコピーしました！'));
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setLoading(a) { document.getElementById('loadingOverlay').classList.toggle('active',a); document.getElementById('generateBtn').disabled=a; }
function showError(m) { const e=document.getElementById('errorMsg'); e.textContent=m; e.style.display='block'; }
function hideError() { document.getElementById('errorMsg').style.display='none'; }
</script>
</body>
</html>
